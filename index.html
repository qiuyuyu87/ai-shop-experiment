setTimeout(() => {
const isSearch = config.product === 'search';
let tableHtml = isSearch ? `<div style="margin-bottom: 8px; font-weight: 600;">📊 5款产品参数对比</div><div class="compare-table"><table><thead><tr><th>产品</th><th>价格</th><th>续航</th><th>防水</th><th>降噪</th><th>口碑</th></tr></thead><tbody>${products.map(p => `<tr><td class="product-name">${p.emoji} ${p.name.split(' ').slice(0, 2).join(' ')}</td><td class="price">¥${p.price}</td><td>${p.specs['续航时长']}</td><td>${p.specs['防水等级']}</td><td>${p.specs['主动降噪'].includes('支持') ? '✓' : '✗'}</td><td>${p.rating}</td></tr>`).join('')}</tbody></table></div>` : `<div style="margin-bottom: 8px; font-weight: 600;">📊 5款香水核心对比</div><div class="compare-table"><table><thead><tr><th>产品</th><th>价格</th><th>香调</th><th>留香</th><th>容量</th><th>口碑</th></tr></thead><tbody>${products.map(p => `<tr><td class="product-name">${p.emoji} ${p.name.split(' ').slice(0, 2).join(' ')}</td><td class="price">¥${p.price}</td><td>${p.specs['香调类型']}</td><td>${p.specs['留香时长']}</td><td>${p.specs['容量规格']}</td><td>${p.rating}</td></tr>`).join('')}</tbody></table></div>`;
addAIMessage(tableHtml, true);
setTimeout(() => {
const chat = document.getElementById('chatArea');
products.forEach(p => {
chat.insertAdjacentHTML('beforeend', `<div class="message"><div style="width: 36px; flex-shrink: 0;"></div><div style="flex: 1; max-width: calc(100% - 46px);"><div class="product-card"><div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div><div class="header-row"><div class="image">${p.emoji}</div><div class="info"><div class="name">${p.name}</div><div class="price-row"><span class="price">¥${p.price}</span><span class="price-old">¥${p.priceOld}</span></div><div class="meta">⭐ ${p.rating} · ${p.reviewLevel} · ${p.salesLevel}</div></div></div><div class="specs-table">${Object.entries(p.specs).slice(0, 4).map(([k, v]) => `<div class="spec-row"><span class="spec-label">${k}</span><span class="spec-value">${v}</span></div>`).join('')}</div><div class="review-summary"><span class="label">💬 评价：</span>${p.reviewSummary}</div><button class="select-btn" onclick="selectProduct('${p.id}', '${p.name}')">我选这款</button></div></div></div>`);
});
scrollToBottom();
setTimeout(() => showPresetQuestions(), 500);
}, 800);
}, 800);
}

function showPresetQuestions() {
const questions = PRESET_QA[config.product];
document.getElementById('chatArea').insertAdjacentHTML('beforeend', `<div class="message"><div style="width: 36px; flex-shrink: 0;"></div><div style="flex: 1;"><div class="suggested-questions"><div class="label">💬 您也可以问我以下问题：</div>${questions.map((q, i) => `<button class="q-btn" onclick="askQuestion(${i})" id="qbtn-${i}">${q.q}</button>`).join('')}</div></div></div>`);
scrollToBottom();
}

function askQuestion(idx) {
const qa = PRESET_QA[config.product][idx];
document.getElementById(`qbtn-${idx}`).disabled = true;
askedQuestions.add(idx);
addUserMessage(qa.q);
setTimeout(() => addAIMessage(qa.a), 1000);
}

function selectProduct(id, name) {
if (hasSelected) return;
const elapsed = (Date.now() - startTime) / 1000;
if (elapsed < config.minStayTime) { alert(`请先充分浏览各款产品信息后再做选择`); return; }
hasSelected = true;
showCompletionModal(name);
}

function showConfirmButton() {
document.getElementById('confirmArea').innerHTML = `<div class="confirm-area"><div class="confirm-btn-group"><button class="confirm-btn" id="confirmBtn" onclick="confirmOrder()" disabled>✓ 确认下单</button><button class="detail-btn" onclick="showDetailModal()">📊 查看详细分析</button></div><div class="status-hint" id="statusHint">正在为您准备...</div></div>`;
startCountdown();
}

function startCountdown() {
const btn = document.getElementById('confirmBtn'), hint = document.getElementById('statusHint');
const timer = setInterval(() => {
const elapsed = (Date.now() - startTime) / 1000, remaining = config.minStayTime - elapsed;
if (remaining <= 0) { btn.disabled = false; hint.innerText = '✓ 您可以确认下单'; hint.style.color = '#10B981'; clearInterval(timer); }
else hint.innerText = '请先充分了解推荐信息...';
}, 300);
}

function confirmOrder() {
if (hasSelected) return;
hasSelected = true;
showCompletionModal(PRODUCTS[config.product][0].name);
}

function showDetailModal() {
const products = PRODUCTS[config.product], isSearch = config.product === 'search';
const html = `<div class="detail-section"><div class="title">📊 5款候选商品综合评分</div><div class="content">${products.map((p, i) => `<div style="padding: 4px 0;">No.${i+1} <b>${p.name.split(' ').slice(0, 2).join(' ')}</b> — ${p.score}分${i === 0 ? ' ⭐已选定' : ''}</div>`).join('')}</div></div><div class="detail-section"><div class="title">🎯 为什么选择 ${products[0].name.split(' ').slice(0, 2).join(' ')}</div><div class="content">${products[0].reason}</div></div><div class="detail-section"><div class="title">❌ 其他产品的不足</div><div class="excluded-list">${products.slice(1).map(p => `<div class="excluded-item">• <b>${p.name.split(' ').slice(0, 2).join(' ')}</b>：${p.reason.split('。')[0]}，综合评分${p.score}分，略逊于首选。</div>`).join('')}</div></div><div class="detail-section"><div class="title">💡 AI最终判断</div><div class="content">基于您"${isSearch ? '通勤+运动场景，预算300元' : '日常使用，预算300元'}"的需求，综合考量${isSearch ? '运动场景适配度、续航、用户口碑' : '香调适配度、留香时长、综合喜爱度'}三大核心维度，<b>${products[0].name.split(' ').slice(0, 2).join(' ')}</b> 在多项指标上显著领先，是当前最优选择。</div></div>`;
document.getElementById('detailContent').innerHTML = html;
document.getElementById('detailModal').classList.add('active');
}

function closeDetailModal() { document.getElementById('detailModal').classList.remove('active'); }

function showCompletionModal(productName) {
const isHigh = config.autonomy === 'high', elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
console.log('实验数据:', { group: currentGroup, duration: elapsed, selectedProduct: productName, questionsAsked: Array.from(askedQuestions) });
document.getElementById('modal1Title').innerText = isHigh ? 'AI已为您完成购买决策' : '您已成功完成购买';
document.getElementById('modal1Message').innerHTML = `已购买：<b>${productName}</b>`;
document.getElementById('modal1').classList.add('active');
setTimeout(() => {
document.getElementById('modal1').classList.remove('active');
document.getElementById('modal2Message').innerHTML = isHigh ? '感谢您体验AI智能购物助手<br>本次购物已<b>自动</b>完成<br>请返回问卷继续作答' : '感谢您使用AI购物信息助手<br>您的购买已完成<br>请返回问卷继续作答';
document.getElementById('modal2').classList.add('active');
}, 5000);
}

function returnToSurvey() {
alert('演示模式：返回问卷\n\n实际部署时将跳转至问卷星链接\n当前分组：' + currentGroup);
}

function scrollToBottom() { setTimeout(() => { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 100); }
</script>
</body>
</html>
