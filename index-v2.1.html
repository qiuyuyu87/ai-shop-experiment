body { background: #F3F4F6; color: #1F2937; line-height: 1.6; }

/* ============ 分组选择页 ============ */

.selector .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 6px; }
.badge.high { background: #DBEAFE; color: #1E40AF; }
.badge.low { background: #D1FAE5; color: #065F46; }

/* ============ 页面头部 ============ */

.btn-primary:hover { background: #2563EB; }

/* ============ 聊天区 ============ */

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.message.user { flex-direction: row-reverse; }

.bubble.ai-full { max-width: 90%; background: white; border: 1px solid #E5E7EB; }

/* ============ 思考动画（V2.1强化进度条） ============ */
.thinking { background: #F3F4F6; padding: 14px 16px; border-radius: 12px; max-width: 78%; }
.thinking .title { font-size: 13px; color: #6B7280; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.thinking .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3B82F6; animation: pulse 1.4s infinite; }
.thinking .dot:nth-child(2) { animation-delay: 0.2s; }
.thinking .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
.thinking .progress-bar { width: 100%; height: 4px; background: #E5E7EB; border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
.thinking .progress-fill { height: 100%; background: linear-gradient(90deg, #3B82F6, #60A5FA); width: 0%; animation: progressFill 3.6s ease-out forwards; }
@keyframes progressFill { to { width: 100%; } }
.thinking .step { font-size: 13px; color: #4B5563; padding: 5px 0; opacity: 0; animation: fadeInStep 0.5s forwards; display: flex; align-items: center; gap: 6px; }
.thinking .step::before { content: '○'; color: #9CA3AF; font-size: 10px; }
.thinking .step.s1 { animation-delay: 0.5s; }
.thinking .step.s2 { animation-delay: 1.3s; }
.thinking .step.s3 { animation-delay: 2.1s; }
.thinking .step.s4 { animation-delay: 2.9s; }
.thinking .step.done::before { content: '✓'; color: #10B981; }
@keyframes fadeInStep { to { opacity: 1; } }

/* ============ AI分析报告 ============ */
.analysis-report { background: linear-gradient(135deg, #EFF6FF 0%, white 100%); border: 1px solid #BFDBFE; border-radius: 10px; padding: 16px; margin-bottom: 12px; }

.analysis-report .section-title { font-size: 12px; font-weight: 600; color: #1F2937; margin-bottom: 6px; }
.analysis-report .section-content { font-size: 12.5px; color: #4B5563; line-height: 1.7; padding-left: 4px; }
.analysis-report .step-item { padding: 3px 0; }
.analysis-report .step-num { color: #3B82F6; font-weight: 600; margin-right: 4px; }
.analysis-report .arrow { color: #9CA3AF; margin: 0 4px; }
.score-list { background: white; border: 1px solid #E5E7EB; border-radius: 8px; padding: 10px 14px; margin-top: 8px; }
.score-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 13px; border-bottom: 1px dashed #F3F4F6; }
.score-item:last-child { border-bottom: none; }
.score-item.selected { font-weight: 600; color: #1E40AF; }
.score-item .rank { color: #6B7280; margin-right: 8px; font-size: 12px; }
.score-item .score { color: #3B82F6; font-weight: 600; }
.score-item .selected-badge { background: #3B82F6; color: white; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin-left: 6px; }

/* ============ V2.1新增：AI排除说明可展开 ============ */
.ai-exclusion-toggle { margin-top: 12px; padding: 10px; background: #F9FAFB; border-radius: 6px; cursor: pointer; font-size: 12.5px; color: #6B7280; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
.ai-exclusion-toggle:hover { background: #F3F4F6; }
.ai-exclusion-toggle .arrow-icon { transition: transform 0.3s; }
.ai-exclusion-toggle.expanded .arrow-icon { transform: rotate(180deg); }

.ai-exclusion-item:last-child { border-bottom: none; }
.ai-exclusion-item .x-icon { color: #DC2626; font-weight: 600; margin-right: 6px; }

function askQuestion(idx) {

function switchThumb(el, imgUrl) {

function updateBrowsedCount() {

// ============================================
// V2.1新增：对比功能（仅低自主组）
// ============================================
function toggleCompare(productId, btn) {
  if (selectedForCompare.has(productId)) {
    selectedForCompare.delete(productId);
    btn.classList.remove('compare-checked');
  } else {
    if (selectedForCompare.size >= 3) {
      alert('最多对比3款商品');
      return;
    }
    selectedForCompare.add(productId);
    btn.classList.add('compare-checked');
  }
  updateCompareFloating();
}

function updateCompareFloating() {
  const floating = document.getElementById('compareFloating');
  const count = selectedForCompare.size;
  document.getElementById('compareCount').innerText = count;
  if (count >= 2) floating.classList.add('show');
  else floating.classList.remove('show');
}

function showCompareModal() {
  const products = PRODUCTS[config.product].filter(p => selectedForCompare.has(p.id));
  const isSearch = config.product === 'search';
  const specKeys = isSearch
    ? ['蓝牙版本', '续航时长（含充电仓）', '防水等级', '主动降噪', '单耳重量', '充电方式', '通话降噪']
    : ['香调类型', '前调', '中调', '后调', '留香时长', '香味浓度', '容量规格', '适用季节'];

  const html = `
    <h3>对比已选 ${products.length} 款商品</h3>
    <div class="compare-grid">
      <table>
        <thead>
          <tr>
            <th>对比项</th>
            ${products.map(p => `<th>${p.name.split(' ').slice(0, 2).join(' ')}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          <tr><td>价格</td>${products.map(p => `<td style="color: #DC2626; font-weight: 600;">¥${p.price}</td>`).join('')}</tr>
          <tr><td>评分</td>${products.map(p => `<td>⭐ ${p.rating}</td>`).join('')}</tr>
          ${specKeys.map(k => `<tr><td>${k}</td>${products.map(p => `<td>${p.specs[k] || '-'}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('compareModalBody').innerHTML = html;
  document.getElementById('compareModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeCompareModal() {
  document.getElementById('compareModal').classList.remove('active');

// ============================================
// V2.1强化：选择商品（低自主组带二次确认）
// ============================================
function tryToSelectProduct(id, name) {
  if (hasSelected) return;
  const elapsed = (Date.now() - startTime) / 1000;
  if (elapsed < config.minStayTime) {
    alert(`请先充分浏览各款产品信息后再做选择（建议至少浏览${config.minStayTime}秒）`);
    return;
  }
  pendingSelectId = id;
  document.getElementById('confirmProductName').innerText = name;
  document.getElementById('confirmSelectModal').classList.add('active');
}

function cancelSelect() {
  pendingSelectId = null;
  document.getElementById('confirmSelectModal').classList.remove('active');
}

function confirmSelect() {
  if (hasSelected || !pendingSelectId) return;
  const product = PRODUCTS[config.product].find(p => p.id === pendingSelectId);
  document.getElementById('confirmSelectModal').classList.remove('active');
  hasSelected = true;
  showCompletionModal(product.name);
}

// 高自主组：确认下单
// ============================================
function showConfirmButton() {
  document.getElementById('confirmArea').innerHTML = `
    <div class="confirm-area">
      <div class="confirm-btn-group">
        <button class="confirm-btn" id="confirmBtn" onclick="confirmOrder()" disabled>
          ✓ 确认下单
          <span class="btn-sub">（AI已为您选定最优）</span>
        </button>
        <button class="detail-btn" onclick="showAiAnalysisModal()">📊 查看详细分析</button>
      </div>
      <div class="status-hint" id="statusHint">⏳ 正在为您准备...</div>
    </div>`;
  startCountdown();
}

function startCountdown() {
  const btn = document.getElementById('confirmBtn'), hint = document.getElementById('statusHint');
  const timer = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000, remaining = config.minStayTime - elapsed;
    if (remaining <= 0) {
      btn.disabled = false;
      hint.innerText = '✓ 您可以确认下单';
      hint.style.color = '#10B981';
      clearInterval(timer);
    } else {
      hint.innerText = '⏳ 请先充分了解推荐信息...';
    }
  }, 300);
}

function confirmOrder() {
  if (hasSelected) return;
  hasSelected = true;
  showCompletionModal(PRODUCTS[config.product][0].name);
}
